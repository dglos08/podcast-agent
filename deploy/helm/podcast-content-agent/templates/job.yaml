apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "podcast-content-agent.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "podcast-content-agent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "podcast-content-agent.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "podcast-content-agent.serviceAccountName" . }}
      restartPolicy: {{ .Values.restartPolicy }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --input
            - {{ .Values.input.file | quote }}
            - --output-dir
            - {{ .Values.output.directory | quote }}
          env:
            - name: MODEL_PROVIDER
              value: {{ .Values.model.provider | quote }}
            - name: MODEL_NAME
              value: {{ .Values.model.name | quote }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | quote }}
                  key: {{ .Values.secret.anthropicKey | quote }}
            - name: BRAVE_SEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret | quote }}
                  key: {{ .Values.secret.braveSearchKey | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}